<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ask James | RealWolfPack.com</title><style>:root{--blue:#19469D;--dark:#102f6c;--orange:#F5821F;--sand:#F5E9D0;--gray:#E2E3E4;--text:#333;--muted:#58697f}*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:linear-gradient(180deg,#fff,#fbf7ef);color:var(--text);min-height:100vh}.wrap{width:min(920px,calc(100% - 32px));margin:auto}.top{padding:18px 0;display:flex;justify-content:space-between;gap:16px;align-items:center}.brand,.top a{font-weight:900;color:var(--dark);text-decoration:none}.hero{padding:48px 0 24px}.eyebrow{color:var(--orange);font-weight:900;letter-spacing:.13em;text-transform:uppercase;font-size:13px}h1{font-size:clamp(40px,7vw,68px);line-height:.92;letter-spacing:-.07em;color:var(--dark);margin:8px 0 12px}h1 em{font-style:normal;color:var(--orange)}p{font-size:18px;color:var(--muted);line-height:1.55}.panel{background:#fff;border:1px solid rgba(25,70,157,.14);border-radius:32px;padding:32px;box-shadow:0 24px 70px rgba(16,47,108,.1);margin-bottom:60px}.field{margin-bottom:18px}label{font-weight:900;color:var(--dark);display:block;margin-bottom:6px;font-size:14px}input,select,textarea{width:100%;padding:14px;border:1.5px solid #d4dce7;border-radius:14px;font-size:16px;font-family:inherit}textarea{min-height:130px}.btn{background:var(--orange);color:#2f1700;border:0;border-radius:999px;padding:16px 24px;font-weight:900;font-size:16px;cursor:pointer;width:100%;box-shadow:0 12px 30px rgba(245,130,31,.25)}.btn:disabled{opacity:.6;cursor:not-allowed}.alert{display:none;padding:16px;border-radius:14px;font-weight:700;margin-bottom:20px}.alert.success{display:block;background:#ecfdf5;color:#065f46;border:1px solid #a7f3d0}.alert.error{display:block;background:#fef2f2;color:#991b1b;border:1px solid #fecaca}</style></head><body><header class="wrap top"><a class="brand" href="../index.html">REALWOLFPACK.COM</a><nav><a href="index.html">Dashboard</a> &nbsp; <a href="training-library.html">Library</a> &nbsp; <span id="nav-auth-section"></span></nav></header><main class="wrap"><section class="hero"><p class="eyebrow">Direct Member Mentorship</p><h1>Ask <em>James.</em></h1><p>Have a question on a contract, need a second pair of eyes on a listing strategy, or want help configuring a marketing workflow? Submit your question below for direct guidance.</p></section><section class="panel"><div id="alert-box" class="alert"></div><form id="support-form"><div class="field"><label for="topic">What do you need help with?</label><select id="topic"><option value="deal">Transaction / Deal / Contract Question</option><option value="listing">Listing Appointment / CMA Strategy</option><option value="marketing">Social Media / Video / Marketing Review</option><option value="tech">AI / CRM / Tech Workflow Brainstorming</option><option value="attraction">Agent Attraction / Revenue Share Conversation</option><option value="other">General Strategy / Accountability</option></select></div><div class="field"><label for="urgency">Urgency</label><select id="urgency"><option value="normal">Normal (reply within 24 hours)</option><option value="time-sensitive">Time Sensitive (deal pending / client waiting)</option></select></div><div class="field"><label for="question">Details of your question or idea *</label><textarea id="question" required placeholder="Provide the details, address, client situation, or tool you want to discuss..."></textarea></div><button id="submit-btn" type="submit" class="btn">Send Question to James</button></form></section></main><script type="module">
import { initContentGate } from "../js/content-gate.js";
import { auth, db, addDoc, collection, serverTimestamp } from "../js/firebase-init.js";

initContentGate();

const form = document.querySelector("#support-form");
const alertBox = document.querySelector("#alert-box");
const submitBtn = document.querySelector("#submit-btn");

form.onsubmit = async (e) => {
  e.preventDefault();
  submitBtn.disabled = true;
  submitBtn.textContent = "Sending...";

  const user = auth.currentUser;
  try {
    await addDoc(collection(db, "supportRequests"), {
      userId: user ? user.uid : "anonymous",
      userEmail: user ? user.email : "unauthed",
      topic: document.querySelector("#topic").value,
      urgency: document.querySelector("#urgency").value,
      question: document.querySelector("#question").value.trim(),
      status: "open",
      createdAt: serverTimestamp()
    });

    alertBox.className = "alert success";
    alertBox.textContent = "Your question has been sent directly to James! He will reach out shortly.";
    form.reset();
  } catch (err) {
    console.error("Support submission error:", err);
    alertBox.className = "alert error";
    alertBox.textContent = "There was an error sending your question. You can also email James directly at james@jamesjestes.com.";
  } finally {
    submitBtn.disabled = false;
    submitBtn.textContent = "Send Question to James";
  }
};
</script></body></html>
